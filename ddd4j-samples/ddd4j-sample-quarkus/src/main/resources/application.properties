# =============================================================
# ddd4j Quarkus 示例应用配置
# =============================================================
# HTTP 端口（ddd4j-sample-quarkus 默认 8080，与 README 一致）
quarkus.http.port=8080

# HTTP 根路径
quarkus.http.root-path=/

# Banner（关闭以便示例日志更简洁）
quarkus.banner.enabled=false

# 日志级别
quarkus.log.level=INFO
quarkus.log.category."io.ddd4j".level=DEBUG
quarkus.log.category."io.ddd4j.sample".level=DEBUG

# =============================================================
# ddd4j Web Quarkus 扩展配置
# =============================================================
# 异常处理模式：unified200（统一 200，错误码进 body）| standard（HTTP 状态码真实反映错误）
ddd4j.quarkus.web.exception-handler=unified200

# =============================================================
# 测试配置（被 QuarkusTest 自动加载）
# =============================================================
%test.quarkus.http.test-port=8081
%test.ddd4j.quarkus.web.exception-handler=standard