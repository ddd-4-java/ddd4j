# =============================================================
# ddd4j Quarkus + CQRS 示例应用配置
# =============================================================
# HTTP 端口（ddd4j-sample-quarkus-cqrs 默认 8080，与 README 一致）
quarkus.http.port=8080
# HTTP 根路径
quarkus.http.root-path=/
# Banner（关闭以便示例日志更简洁）
quarkus.banner.enabled=false
# 日志级别
quarkus.log.level=INFO
quarkus.log.category."io.ddd4j".level=DEBUG
quarkus.log.category."io.ddd4j.sample".level=DEBUG
# =============================================================
# ddd4j Web Quarkus 扩展配置
# =============================================================
# 异常处理模式：unified200（统一 200，错误码进 body）| standard（HTTP 状态码真实反映错误）
ddd4j.quarkus.web.exception-handler=unified200
# =============================================================
# 测试配置（被 QuarkusTest 自动加载）
# =============================================================
# 并行版本线测试使用系统分配端口，避免固定 8081 冲突。
%test.quarkus.http.test-port=0
%test.ddd4j.quarkus.web.exception-handler=standard

# 持久化入口显式选择原生 R08 runner、ORM/JTA 和 PostgreSQL；不创建或迁移业务表。
ddd4j.quarkus.cqrs.projection.mode=durable
ddd4j.quarkus.cqrs.projection.position-store=panache
quarkus.datasource.db-kind=postgresql
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=${ORDER_JDBC_URL:jdbc:postgresql://localhost:5432/ddd4j_sample}
quarkus.datasource.username=${ORDER_DB_USER:ddd4j}
quarkus.datasource.password=${ORDER_DB_PASSWORD:ddd4j}
quarkus.hibernate-orm.database.generation=validate
quarkus.hibernate-orm.packages=io.ddd4j.data.event.store.jpa,io.ddd4j.data.projection.panache
quarkus.index-dependency.order-event.group-id=io.ddd4j
quarkus.index-dependency.order-event.artifact-id=ddd4j-data-event-store-jpa
quarkus.index-dependency.order-position.group-id=io.ddd4j
quarkus.index-dependency.order-position.artifact-id=ddd4j-data-event-store-panache
