<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ddd4j 架构视图 (优化版)</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #F5F5F7; /* iOS System Gray 6 */
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            padding: 40px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 
           SVG Design Logic:
           Width: 1120px (1200 - 80 padding)
           Left Column (Label): 120px
           Gap: 20px
           Right Column (Content): 980px
           
           Vertical Layout:
           1. Samples (Top): Height 100px
           2. Gap: 30px
           3. Components: Height 240px (3 rows)
           4. Gap: 30px
           5. Core: Height 160px
           6. Gap: 30px
           7. Management: Height 90px
           
           Total SVG Height: ~700px
        -->
        <svg width="100%" height="700" viewBox="0 0 1120 700" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <!-- Filters for iOS/Material depth -->
                <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
                    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.08"/>
                </filter>
                <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
                    <feFlood flood-color="#FFFFFF" flood-opacity="0.3"/>
                    <feComposite operator="out" in2="SourceGraphic"/>
                    <feGaussianBlur stdDeviation="2"/>
                    <feComposite operator="atop" in2="SourceGraphic"/>
                </filter>
                
                <!-- Gradients -->
                <linearGradient id="bg-samples" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#F5F5F7" />
                    <stop offset="100%" style="stop-color:#E5E5EA" />
                </linearGradient>
                <linearGradient id="bg-blue" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#007AFF" />
                    <stop offset="100%" style="stop-color:#0056B3" />
                </linearGradient>
                <linearGradient id="bg-green" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#34C759" />
                    <stop offset="100%" style="stop-color:#248A3D" />
                </linearGradient>
                <linearGradient id="bg-orange" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#FF9500" />
                    <stop offset="100%" style="stop-color:#C66900" />
                </linearGradient>
                <linearGradient id="bg-purple" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#5856D6" />
                    <stop offset="100%" style="stop-color:#3634A3" />
                </linearGradient>
            </defs>

            <!-- ==============================
                 Layer 1: 应用示例 (Samples)
                 Y: 0, Height: 100
            =============================== -->
            <g transform="translate(0, 0)">
                <!-- Left Label -->
                <rect x="0" y="0" width="120" height="100" rx="16" fill="url(#bg-purple)" filter="url(#dropShadow)"/>
                <text x="60" y="55" font-size="16" fill="white" font-weight="bold" text-anchor="middle" dominant-baseline="middle">应用示例</text>
                
                <!-- Right Content Container -->
                <rect x="140" y="0" width="980" height="100" rx="16" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="1"/>
                
                <!-- Items Row -->
                <g transform="translate(150, 15)">
                     <!-- 7 items, ~130px each + 10px gap -->
                    <g>
                        <rect x="0" y="0" width="125" height="70" rx="10" fill="white" filter="url(#dropShadow)"/>
                        <text x="62.5" y="35" font-size="13" fill="#333" font-weight="500" text-anchor="middle" dominant-baseline="middle">Druid / HikariCP</text>
                    </g>
                    <g transform="translate(135, 0)">
                        <rect x="0" y="0" width="125" height="70" rx="10" fill="white" filter="url(#dropShadow)"/>
                        <text x="62.5" y="35" font-size="13" fill="#333" font-weight="500" text-anchor="middle" dominant-baseline="middle">ActiveMQ</text>
                    </g>
                    <g transform="translate(270, 0)">
                        <rect x="0" y="0" width="125" height="70" rx="10" fill="white" filter="url(#dropShadow)"/>
                        <text x="62.5" y="35" font-size="13" fill="#333" font-weight="500" text-anchor="middle" dominant-baseline="middle">RabbitMQ</text>
                    </g>
                    <g transform="translate(405, 0)">
                        <rect x="0" y="0" width="125" height="70" rx="10" fill="white" filter="url(#dropShadow)"/>
                        <text x="62.5" y="35" font-size="13" fill="#333" font-weight="500" text-anchor="middle" dominant-baseline="middle">Kafka</text>
                    </g>
                    <g transform="translate(540, 0)">
                        <rect x="0" y="0" width="125" height="70" rx="10" fill="white" filter="url(#dropShadow)"/>
                        <text x="62.5" y="35" font-size="13" fill="#333" font-weight="500" text-anchor="middle" dominant-baseline="middle">RocketMQ</text>
                    </g>
                    <g transform="translate(675, 0)">
                        <rect x="0" y="0" width="125" height="70" rx="10" fill="white" filter="url(#dropShadow)"/>
                        <text x="62.5" y="35" font-size="13" fill="#333" font-weight="500" text-anchor="middle" dominant-baseline="middle">MQTT</text>
                    </g>
                    <g transform="translate(810, 0)">
                        <rect x="0" y="0" width="125" height="70" rx="10" fill="white" filter="url(#dropShadow)"/>
                        <text x="62.5" y="35" font-size="13" fill="#333" font-weight="500" text-anchor="middle" dominant-baseline="middle">WebFlux</text>
                    </g>
                </g>
            </g>

            <!-- ==============================
                 Layer 2: 功能组件 (Components)
                 Y: 130, Height: 240
            =============================== -->
            <g transform="translate(0, 130)">
                <!-- Left Label -->
                <rect x="0" y="0" width="120" height="240" rx="16" fill="url(#bg-green)" filter="url(#dropShadow)"/>
                <text x="60" y="120" font-size="16" fill="white" font-weight="bold" text-anchor="middle" dominant-baseline="middle">功能组件</text>
                
                <!-- Right Content Container -->
                <rect x="140" y="0" width="980" height="240" rx="16" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="1"/>
                
                <!-- Inner Layout: 3 Rows -->
                <g transform="translate(150, 15)">
                    
                    <!-- Row 1: Web & Data (Green Tint) -->
                    <g>
                        <rect x="0" y="0" width="960" height="64" rx="10" fill="#E8F5E9" stroke="#C8E6C9" stroke-width="0.5"/>
                        <text x="20" y="32" font-size="14" fill="#2E7D32" font-weight="bold" dominant-baseline="middle">Web与数据</text>
                        <!-- Items -->
                        <g transform="translate(110, 12)">
                            <rect x="0" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="75" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">WebMVC</text>
                            
                            <rect x="170" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="245" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">WebFlux</text>
                            
                            <rect x="340" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="415" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">Jackson</text>
                            
                            <rect x="510" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="585" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">Validation</text>

                            <rect x="680" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="755" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">External</text>
                        </g>
                    </g>

                    <!-- Row 2: Security (Blue Tint - visually distinct inside green theme) -->
                    <g transform="translate(0, 74)">
                        <rect x="0" y="0" width="960" height="64" rx="10" fill="#E3F2FD" stroke="#BBDEFB" stroke-width="0.5"/>
                        <text x="20" y="32" font-size="14" fill="#1565C0" font-weight="bold" dominant-baseline="middle">安全与权限</text>
                         <!-- Items -->
                        <g transform="translate(110, 12)">
                            <rect x="0" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="75" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">SaToken</text>
                            
                            <rect x="170" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="245" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">DataScope</text>
                            
                            <rect x="340" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="415" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">License</text>
                            
                            <rect x="510" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="585" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">Crypto (加解密)</text>
                        </g>
                    </g>

                    <!-- Row 3: Architecture (Orange Tint) -->
                    <g transform="translate(0, 148)">
                        <rect x="0" y="0" width="960" height="64" rx="10" fill="#FFF3E0" stroke="#FFE0B2" stroke-width="0.5"/>
                        <text x="20" y="32" font-size="14" fill="#EF6C00" font-weight="bold" dominant-baseline="middle">架构与中间件</text>
                         <!-- Items -->
                        <g transform="translate(110, 12)">
                            <rect x="0" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="75" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">COLA 架构</text>
                            
                            <rect x="170" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="245" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">PF4J 插件</text>
                            
                            <rect x="340" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="415" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">Akka Actor</text>
                            
                            <rect x="510" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="585" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">Logs 日志</text>

                            <rect x="680" y="0" width="150" height="40" rx="6" fill="white" filter="url(#dropShadow)"/>
                            <text x="755" y="20" font-size="13" fill="#333" text-anchor="middle" dominant-baseline="middle">Kafka</text>
                        </g>
                    </g>

                </g>
            </g>

            <!-- ==============================
                 Layer 3: 核心基础 (Core)
                 Y: 400, Height: 160
            =============================== -->
            <g transform="translate(0, 400)">
                <!-- Left Label -->
                <rect x="0" y="0" width="120" height="160" rx="16" fill="url(#bg-blue)" filter="url(#dropShadow)"/>
                <text x="60" y="80" font-size="16" fill="white" font-weight="bold" text-anchor="middle" dominant-baseline="middle">核心基础</text>
                
                <!-- Right Content Container -->
                <rect x="140" y="0" width="980" height="160" rx="16" fill="#F2F2F7" stroke="#E5E5EA" stroke-width="1"/>
                
                <!-- 3 Columns -->
                <g transform="translate(150, 15)">
                    <!-- Column 1: API -->
                    <g>
                        <rect x="0" y="0" width="310" height="130" rx="10" fill="white" stroke="#BBDEFB" stroke-width="0.5" filter="url(#dropShadow)"/>
                        <rect x="0" y="0" width="310" height="36" rx="10" fill="#E3F2FD"/>
                        <text x="155" y="22" font-size="14" fill="#1565C0" font-weight="bold" text-anchor="middle" dominant-baseline="middle">基础 API (API Support)</text>
                        
                        <g transform="translate(15, 46)">
                             <text x="0" y="10" font-size="12" fill="#555">• BaseController / Service / Mapper</text>
                             <text x="0" y="32" font-size="12" fill="#555">• ApiRestResponse / Result</text>
                             <text x="0" y="54" font-size="12" fill="#555">• ApiModule / ApiOperationLog</text>
                             <text x="0" y="76" font-size="12" fill="#555">• Global Exception Handling</text>
                        </g>
                    </g>

                    <!-- Column 2: Objects -->
                    <g transform="translate(325, 0)">
                        <rect x="0" y="0" width="310" height="130" rx="10" fill="white" stroke="#BBDEFB" stroke-width="0.5" filter="url(#dropShadow)"/>
                        <rect x="0" y="0" width="310" height="36" rx="10" fill="#E3F2FD"/>
                        <text x="155" y="22" font-size="14" fill="#1565C0" font-weight="bold" text-anchor="middle" dominant-baseline="middle">领域对象 (Domain Objects)</text>
                         <g transform="translate(15, 46)">
                             <text x="0" y="10" font-size="12" fill="#555">• BaseDTO / BaseEntity / BaseParam</text>
                             <text x="0" y="32" font-size="12" fill="#555">• BizRuntimeException / BizException</text>
                             <text x="0" y="54" font-size="12" fill="#555">• Subject / AuthPrincipal</text>
                             <text x="0" y="76" font-size="12" fill="#555">• Constants / Enums</text>
                        </g>
                    </g>

                    <!-- Column 3: Utils -->
                    <g transform="translate(650, 0)">
                        <rect x="0" y="0" width="310" height="130" rx="10" fill="white" stroke="#BBDEFB" stroke-width="0.5" filter="url(#dropShadow)"/>
                        <rect x="0" y="0" width="310" height="36" rx="10" fill="#E3F2FD"/>
                        <text x="155" y="22" font-size="14" fill="#1565C0" font-weight="bold" text-anchor="middle" dominant-baseline="middle">通用工具 (Utilities)</text>
                         <g transform="translate(15, 46)">
                             <text x="0" y="10" font-size="12" fill="#555">• WebUtils / IdempotentUtils</text>
                             <text x="0" y="32" font-size="12" fill="#555">• DateUtils / CollectionUtils</text>
                             <text x="0" y="54" font-size="12" fill="#555">• Sequence / RandomString</text>
                             <text x="0" y="76" font-size="12" fill="#555">• IP2Region / UserAgent</text>
                        </g>
                    </g>
                </g>
            </g>

            <!-- ==============================
                 Layer 4: 工程管理 (Management)
                 Y: 590, Height: 90
            =============================== -->
            <g transform="translate(0, 590)">
                <!-- Left Label -->
                <rect x="0" y="0" width="120" height="90" rx="16" fill="url(#bg-orange)" filter="url(#dropShadow)"/>
                <text x="60" y="45" font-size="16" fill="white" font-weight="bold" text-anchor="middle" dominant-baseline="middle">工程管理</text>
                
                <!-- Right Content Container -->
                <rect x="140" y="0" width="980" height="90" rx="16" fill="#FFF8E1" stroke="#FFE0B2" stroke-width="1"/>
                
                <!-- 3 Big Boxes -->
                <g transform="translate(150, 15)">
                     <!-- BOM -->
                     <g>
                        <rect x="0" y="0" width="310" height="60" rx="10" fill="white" stroke="#FFCC80" stroke-width="0.5" filter="url(#dropShadow)"/>
                        <text x="155" y="30" font-size="14" fill="#E65100" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ddd4j-bom (BOM依赖管理)</text>
                     </g>
                     
                     <!-- Parent -->
                     <g transform="translate(325, 0)">
                        <rect x="0" y="0" width="310" height="60" rx="10" fill="white" stroke="#FFCC80" stroke-width="0.5" filter="url(#dropShadow)"/>
                        <text x="155" y="30" font-size="14" fill="#E65100" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ddd4j-parent (Maven父工程)</text>
                     </g>

                     <!-- Dependencies -->
                     <g transform="translate(650, 0)">
                        <rect x="0" y="0" width="310" height="60" rx="10" fill="white" stroke="#FFCC80" stroke-width="0.5" filter="url(#dropShadow)"/>
                        <text x="155" y="30" font-size="14" fill="#E65100" font-weight="bold" text-anchor="middle" dominant-baseline="middle">ddd4j-dependencies (版本控制)</text>
                     </g>
                </g>
            </g>
            
        </svg>
    </div>
</body>
</html>
