# Task 7.2 集成测试（test profile）——投影位置 JPA IT 的 H2 内存库数据源。
# MODE=PostgreSQL：让 H2 模拟 PG 方言行为，缩小与生产库差异。
# 不声明 driver-class-name：由 Boot 按 URL 推断（H2 轨推断 H2 驱动）。
spring:
  datasource:
    url: "jdbc:h2:mem:projit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1"
    username: "sa"
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
