name: Verify ddd4j

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-contract:
    name: Java 17 unit and contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify BOM publication contract
        run: ./scripts/check-bom-alignment.sh
      - name: Verify Java style guardrails
        run: ./scripts/verify-java-style.sh
      - name: Run unit and adapter contracts
        run: ./mvnw -B clean test -DskipITs

  infrastructure-integration:
    name: Testcontainers infrastructure integration
    runs-on: ubuntu-latest
    needs: unit-and-contract
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify Docker daemon
        run: docker info
      - name: Run Redis, MySQL, PostgreSQL and Kafka integration tests
        run: >-
          ./mvnw -B
          -pl ddd4j-cache,ddd4j-data/ddd4j-data-mybatisplus,ddd4j-mq/ddd4j-mq-kafka,ddd4j-samples/ddd4j-sample-order-jdbc,ddd4j-samples/ddd4j-sample-order-kafka,ddd4j-samples/ddd4j-sample-order-redis
          -am test
