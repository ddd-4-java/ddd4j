name: Verify ddd4j

on:
  push:
    branches: [ 'feature/1.0.x' ]
  pull_request:
    branches: [ 'feature/1.0.x' ]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/super-linter@v5
        env:
          DEFAULT_BRANCH: feature/1.0.x
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_GITHUB_ACTIONS: true
          FILTER_REGEX_INCLUDE: '.*\.github/.*'

  unit-test:
    name: Java unit and contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          overwrite-settings: true

      - name: Configure Easy4J Maven repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>2624322-release-6F6h6R</id>
                <username>${env.ALIYUN_MAVEN_USERNAME}</username>
                <password>${env.ALIYUN_MAVEN_PASSWORD}</password>
              </server>
              <server>
                <id>2624322-snapshot-3EoOv3</id>
                <username>${env.ALIYUN_MAVEN_USERNAME}</username>
                <password>${env.ALIYUN_MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          ALIYUN_MAVEN_USERNAME: ${{ secrets.ALIYUN_MAVEN_USERNAME }}
          ALIYUN_MAVEN_PASSWORD: ${{ secrets.ALIYUN_MAVEN_PASSWORD }}

      - name: Verify BOM publication contract
        run: ./mvnw -U -B -Denforcer.skip=true validate -pl ddd4j-dependencies

      - name: Verify Java style guardrails
        run: ./mvnw -U -B -Denforcer.skip=true checkstyle:check -pl '!ddd4j-bom,!ddd4j-dependencies'
        continue-on-error: true

      - name: Run unit and adapter contracts
        run: ./mvnw -U -B -Denforcer.skip=true -DskipTests=false test

      - name: Verify build did not write generated files to source control
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Build generated files that differ from committed source."
            git diff --stat
            exit 1
          fi

  sbom-license:
    name: SBOM and license reports
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          overwrite-settings: true

      - name: Configure Easy4J Maven repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>2624322-release-6F6h6R</id>
                <username>${env.ALIYUN_MAVEN_USERNAME}</username>
                <password>${env.ALIYUN_MAVEN_PASSWORD}</password>
              </server>
              <server>
                <id>2624322-snapshot-3EoOv3</id>
                <username>${env.ALIYUN_MAVEN_USERNAME}</username>
                <password>${env.ALIYUN_MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          ALIYUN_MAVEN_USERNAME: ${{ secrets.ALIYUN_MAVEN_USERNAME }}
          ALIYUN_MAVEN_PASSWORD: ${{ secrets.ALIYUN_MAVEN_PASSWORD }}

      - name: Install reactor artifacts for plugin resolution
        run: ./mvnw -U -Denforcer.skip=true -B -DskipTests install

      - name: Generate CycloneDX SBOM
        run: |
          ./mvnw -B -Denforcer.skip=true -DskipTests \
            org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom
        continue-on-error: true

      - name: Archive release quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-quality
          path: target/release-quality/
          retention-days: 14
          if-no-files-found: ignore
