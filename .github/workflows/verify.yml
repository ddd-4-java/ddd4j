name: Verify ddd4j
true:
  push:
    branches:
    - main
    - feature/**
  pull_request: null
permissions:
  contents: read
env:
  DDD4J_REPORT_DIR: ${{ github.workspace }}/target/release-quality
  NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
jobs:
  workflow-lint:
    name: GitHub Actions workflow lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Validate workflow syntax
      uses: reviewdog/action-actionlint@v1
      with:
        reporter: github-check
        fail_level: error
  unit-and-contract:
    name: Java 21 unit and contract
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Configure Easy4J Maven repositories
      env:
        MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        ALIYUN_USER: ${{ secrets.ALIYUN_PACKAGES_USERNAME }}
        ALIYUN_PASS: ${{ secrets.ALIYUN_PACKAGES_PASSWORD }}
      shell: bash
      run: "install -d -m 700 \"$HOME/.m2\"\numask 077\nprintf '%s' \"$MAVEN_SETTINGS_XML\"\
        \ | base64 --decode > \"$HOME/.m2/settings.xml\"\n# 凭据连通性自检（直接用 secrets，避免解析\
        \ settings）\nHTTP_CODE=$(curl -s -o /dev/null -w \"%{http_code}\" -u \"$ALIYUN_USER:$ALIYUN_PASS\"\
        \ \\\n  \"https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/2624322-snapshot-3eoov3/io/github/easy4j/spring-extension/3.0.x.20260630-SNAPSHOT/maven-metadata.xml\"\
        \ || echo curl-failed)\necho \"credential check: HTTP $HTTP_CODE (user len\
        \ ${#ALIYUN_USER})\"\n# 确认 settings 的 server 段凭据与 secrets 一致（id 匹配时 Maven\
        \ 才会带鉴权）\ngrep -A1 \"2624322-snapshot-3EoOv3\" \"$HOME/.m2/settings.xml\"\
        \ | head -3 | sed 's/<password>.*/<password>***</'\n"
    - name: Verify BOM publication contract
      run: ./scripts/check-bom-alignment.sh
    - name: Verify Java style guardrails
      run: ./scripts/verify-java-style.sh
    - name: Verify release worktree state
      env:
        DDD4J_REQUIRE_CLEAN_WORKTREE: 'true'
      run: ./scripts/verify-release-worktree.sh
    - name: Verify DDD architecture rules
      run: ./scripts/verify-architecture.sh
    - name: Run unit and adapter contracts
      run: ./mvnw -Denforcer.skip=true -B clean test -DskipITs
    - name: Verify build did not write generated files to source control
      env:
        DDD4J_REQUIRE_CLEAN_WORKTREE: 'true'
      run: ./scripts/verify-release-worktree.sh
  coverage-gate:
    name: Coverage gate (LINE >= 90%)
    runs-on: ubuntu-latest
    needs: workflow-lint
    steps:
    - uses: actions/checkout@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Configure Easy4J Maven repositories
      env:
        MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
      shell: bash
      run: "install -d -m 700 \"$HOME/.m2\"\numask 077\nprintf '%s' \"$MAVEN_SETTINGS_XML\"\
        \ | base64 --decode > \"$HOME/.m2/settings.xml\"\ngrep -q \"2624322-snapshot-3EoOv3\"\
        \ \"$HOME/.m2/settings.xml\"\n# 凭据连通性自检（CI 环境下 401 快速定位）\nUSER_NAME=$(sed\
        \ -n 's/.*<id>2624322-snapshot-3EoOv3<\\/id>\\s*<username>\\([^<]*\\)<\\/username>.*/\\\
        1/p' \"$HOME/.m2/settings.xml\" | head -1)\nPASS_WORD=$(sed -n 's/.*<id>2624322-snapshot-3EoOv3<\\\
        /id>\\s*<username>[^<]*<\\/username>\\s*<password>\\([^<]*\\)<\\/password>.*/\\\
        1/p' \"$HOME/.m2/settings.xml\" | head -1)\nHTTP_CODE=$(curl -s -o /dev/null\
        \ -w \"%{http_code}\" -u \"$USER_NAME:$PASS_WORD\" \\\n  \"https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/2624322-snapshot-3eoov3/io/github/easy4j/spring-extension/3.0.x.20260630-SNAPSHOT/maven-metadata.xml\"\
        \ || echo \"curl-failed\")\necho \"Aliyun packages credential check: HTTP\
        \ $HTTP_CODE (username length: ${#USER_NAME})\"\nif [ \"$HTTP_CODE\" != \"\
        200\" ]; then\n  echo \"::warning::Aliyun auth returned $HTTP_CODE - private\
        \ snapshot deps may fail\"\nfi\n"
    - name: Install reactor dependencies without coverage enforcement
      run: ./mvnw -Denforcer.skip=true -B -DskipTests install
    - name: Enforce 90% line coverage on gated modules
      run: ./mvnw -Denforcer.skip=true -B -Pcoverage verify -pl ddd4j-web/ddd4j-web-core,ddd4j-web/ddd4j-web-vertx,ddd4j-web/ddd4j-web-micronaut,ddd4j-web/ddd4j-web-dropwizard,ddd4j-runtime/ddd4j-runtime-support
  supply-chain-reports:
    name: SBOM and license reports
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Configure Easy4J Maven repositories
      env:
        MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
      shell: bash
      run: "install -d -m 700 \"$HOME/.m2\"\numask 077\nprintf '%s' \"$MAVEN_SETTINGS_XML\"\
        \ | base64 --decode > \"$HOME/.m2/settings.xml\"\ngrep -q \"2624322-snapshot-3EoOv3\"\
        \ \"$HOME/.m2/settings.xml\"\n# 凭据连通性自检（CI 环境下 401 快速定位）\nUSER_NAME=$(sed\
        \ -n 's/.*<id>2624322-snapshot-3EoOv3<\\/id>\\s*<username>\\([^<]*\\)<\\/username>.*/\\\
        1/p' \"$HOME/.m2/settings.xml\" | head -1)\nPASS_WORD=$(sed -n 's/.*<id>2624322-snapshot-3EoOv3<\\\
        /id>\\s*<username>[^<]*<\\/username>\\s*<password>\\([^<]*\\)<\\/password>.*/\\\
        1/p' \"$HOME/.m2/settings.xml\" | head -1)\nHTTP_CODE=$(curl -s -o /dev/null\
        \ -w \"%{http_code}\" -u \"$USER_NAME:$PASS_WORD\" \\\n  \"https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/2624322-snapshot-3eoov3/io/github/easy4j/spring-extension/3.0.x.20260630-SNAPSHOT/maven-metadata.xml\"\
        \ || echo \"curl-failed\")\necho \"Aliyun packages credential check: HTTP\
        \ $HTTP_CODE (username length: ${#USER_NAME})\"\nif [ \"$HTTP_CODE\" != \"\
        200\" ]; then\n  echo \"::warning::Aliyun auth returned $HTTP_CODE - private\
        \ snapshot deps may fail\"\nfi\n"
    - name: Install reactor artifacts for plugin resolution
      run: ./mvnw -Denforcer.skip=true -B -DskipTests -Dquarkus.build.skip=true install
    - name: Install reactor artifacts for plugin resolution
      run: ./mvnw -Denforcer.skip=true -B -DskipTests -Dquarkus.build.skip=true install
    - name: Generate CycloneDX SBOM
      run: ./scripts/generate-sbom.sh
    - name: Generate third-party license inventory
      run: ./scripts/generate-license-report.sh
    - name: Enforce published dependency license policy
      run: ./scripts/verify-license-policy.sh
    - name: Verify reports did not write generated files to source control
      env:
        DDD4J_REQUIRE_CLEAN_WORKTREE: 'true'
      run: ./scripts/verify-release-worktree.sh
    - name: Run opt-in CVE report
      if: ${{ env.NVD_API_KEY != '' }}
      env:
        DDD4J_ENABLE_CVE_SCAN: 'true'
      run: ./scripts/scan-cve.sh
    - name: Record CVE scan prerequisite
      if: ${{ env.NVD_API_KEY == '' }}
      run: 'echo "CVE scan not run: repository secret NVD_API_KEY is not configured."'
    - name: Archive release quality reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ always() }}
      with:
        name: release-quality-reports
        path: target/release-quality
        if-no-files-found: error
        retention-days: 14
  infrastructure-integration:
    name: Testcontainers infrastructure integration
    runs-on: ubuntu-latest
    needs:
    - workflow-lint
    - unit-and-contract
    steps:
    - uses: actions/checkout@v4
      with:
        distribution: temurin
        java-version: '21'
        cache: maven
    - name: Configure Easy4J Maven repositories
      env:
        MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
      shell: bash
      run: "install -d -m 700 \"$HOME/.m2\"\numask 077\nprintf '%s' \"$MAVEN_SETTINGS_XML\"\
        \ | base64 --decode > \"$HOME/.m2/settings.xml\"\ngrep -q \"2624322-snapshot-3EoOv3\"\
        \ \"$HOME/.m2/settings.xml\"\n# 凭据连通性自检（CI 环境下 401 快速定位）\nUSER_NAME=$(sed\
        \ -n 's/.*<id>2624322-snapshot-3EoOv3<\\/id>\\s*<username>\\([^<]*\\)<\\/username>.*/\\\
        1/p' \"$HOME/.m2/settings.xml\" | head -1)\nPASS_WORD=$(sed -n 's/.*<id>2624322-snapshot-3EoOv3<\\\
        /id>\\s*<username>[^<]*<\\/username>\\s*<password>\\([^<]*\\)<\\/password>.*/\\\
        1/p' \"$HOME/.m2/settings.xml\" | head -1)\nHTTP_CODE=$(curl -s -o /dev/null\
        \ -w \"%{http_code}\" -u \"$USER_NAME:$PASS_WORD\" \\\n  \"https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/2624322-snapshot-3eoov3/io/github/easy4j/spring-extension/3.0.x.20260630-SNAPSHOT/maven-metadata.xml\"\
        \ || echo \"curl-failed\")\necho \"Aliyun packages credential check: HTTP\
        \ $HTTP_CODE (username length: ${#USER_NAME})\"\nif [ \"$HTTP_CODE\" != \"\
        200\" ]; then\n  echo \"::warning::Aliyun auth returned $HTTP_CODE - private\
        \ snapshot deps may fail\"\nfi\n"
    - name: Verify Docker daemon
      run: docker info
    - name: Run Redis, MySQL, PostgreSQL and Kafka integration tests
      run: ./mvnw -Denforcer.skip=true -B -pl ddd4j-cache,ddd4j-data/ddd4j-data-mybatisplus,ddd4j-mq/ddd4j-mq-kafka,ddd4j-samples/ddd4j-sample-order-jdbc,ddd4j-samples/ddd4j-sample-order-kafka,ddd4j-samples/ddd4j-sample-order-redis
        -am test
