name: Three-line convergence

on:
  push:
    branches:
      - feature/1.0.x
      - feature/2.0.x
      - feature/3.0.x
  workflow_dispatch:
    inputs:
      scenario_baseline_sha:
        description: Previously verified Git commit containing the scenario matrix
        type: string
        required: false

permissions:
  contents: read

concurrency:
  # A newer push supersedes only runs from the same branch.
  # Manual runs remain independent for frozen evidence collection.
  group: three-line-convergence-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  convergence:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
    steps:
      - name: Check out workflow driver
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: driver
          fetch-depth: 2

      - name: Resolve three immutable inputs
        id: revisions
        working-directory: driver
        shell: bash
        env:
          CURRENT_REF: ${{ github.ref_name }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$CURRENT_REF" in
            feature/1.0.x|feature/2.0.x|feature/3.0.x) ;;
            *) echo "Select one of the three feature branches" >&2; exit 1 ;;
          esac
          for line in 1.0.x 2.0.x 3.0.x; do
            branch="feature/$line"
            if [[ "$branch" == "$CURRENT_REF" ]]; then
              sha="$CURRENT_SHA"
            else
              sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
            fi
            if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Cannot resolve $branch to a full commit SHA" >&2
              exit 1
            fi
            key="sha_${line%%.*}"
            echo "$key=$sha" >> "$GITHUB_OUTPUT"
            echo "$branch: $sha"
          done

      - name: Check out JDK 8 line at fixed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.sha_1 }}
          path: line-8
      - name: Check out JDK 17 line at fixed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.sha_2 }}
          path: line-17
      - name: Check out JDK 21 line at fixed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.sha_3 }}
          path: line-21

      - name: Set up all line JDKs
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            8
            17
            21
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Run convergence gate regression tests
        working-directory: driver
        env:
          DDD4J_JDK21_HOME: ${{ env.JAVA_HOME_21_X64 }}
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: scripts
        run: >-
          python3 -m unittest -q
          scripts/test_three_line_convergence.py
          scripts/test_dependency_alignment.py
          scripts/test_three_line_product_docs.py
          scripts/test_build_historical_evidence_index.py
          scripts/test_three_line_type_mappings.py
          scripts/test_performance_report.py
          scripts/test_verify_cloud_mq_rc_evidence.py
          scripts/test_sbom.py
          scripts/test_license_policy.py
          scripts/test_workflow_line_baseline.py
          scripts/test_platform_cdi_resources.py
          scripts.test_three_line_structure_inventory.ThreeLineInventoryTest.test_missing_production_type_and_test_are_both_open
          scripts.test_three_line_structure_inventory.ThreeLineInventoryTest.test_changed_error_code_fails_inventory_gate
          scripts.test_three_line_structure_inventory.ThreeLineInventoryTest.test_old_target_class_does_not_count_as_current_api
          scripts.test_three_line_structure_inventory.ThreeLineInventoryTest.test_exact_platform_api_allows_jvm_generic_wildcard_but_not_descriptor_glob

      - name: Prepare committed scenario baseline
        shell: bash
        env:
          SCENARIO_BEFORE: ${{ github.event.before }}
          SCENARIO_OVERRIDE: ${{ inputs.scenario_baseline_sha }}
        run: |
          set -euo pipefail
          matrix_path=verification/three-line-parity/scenario-matrix.json
          evidence_dir=target/three-line-convergence
          baseline="$evidence_dir/scenario-baseline.json"
          mkdir -p "$evidence_dir"
          : > "$baseline"

          if [[ -n "$SCENARIO_OVERRIDE" && "$SCENARIO_OVERRIDE" == "$GITHUB_SHA" ]]; then
            echo "The candidate commit cannot be used as its own scenario baseline." >&2
            exit 1
          fi
          baseline_sha="${SCENARIO_OVERRIDE:-$SCENARIO_BEFORE}"
          if [[ -z "$baseline_sha" && "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            baseline_sha="$(git -C driver rev-parse --verify HEAD^ 2>/dev/null || true)"
          fi
          if [[ -n "$baseline_sha" && "$baseline_sha" != '0000000000000000000000000000000000000000' ]]; then
            if [[ ! "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Scenario baseline must be a full Git commit SHA." >&2
              exit 1
            fi
            if ! git -C driver cat-file -e "$baseline_sha^{commit}" 2>/dev/null; then
              git -C driver fetch --no-tags --depth=1 origin "$baseline_sha"
            fi
            if git -C driver cat-file -e "$baseline_sha:$matrix_path" 2>/dev/null; then
              git -C driver show "$baseline_sha:$matrix_path" > "$baseline"
            fi
          fi

          if [[ ! -s "$baseline" ]]; then
            if [[ -n "$SCENARIO_OVERRIDE" ]]; then
              echo "The requested commit does not contain a scenario matrix." >&2
              exit 1
            fi
            # The initial shared baseline predates the matrix on the Java 8 branch.
            baseline_sha='79e9a9abe1c92606d256d4ca92bfd54fdd9cb9e5'
            if ! git -C line-17 cat-file -e "$baseline_sha:$matrix_path" 2>/dev/null; then
              git -C line-17 fetch --no-tags --depth=1 origin "$baseline_sha"
            fi
            git -C line-17 show "$baseline_sha:$matrix_path" > "$baseline"
          fi
          printf '%s\n' "$baseline_sha" > "$evidence_dir/scenario-baseline.commit"

      - name: Check unresolved three-line inventory on push
        if: github.event_name == 'push'
        run: |
          DDD4J_JDK21_HOME="$JAVA_HOME_21_X64" \
          python3 driver/scripts/verify-three-line-structure-api-parity.py \
            --roots line-8 line-17 line-21 \
            --policy driver/config/parity/three-line-policy.json \
            --output target/three-line-convergence/preflight \
            --phase inventory \
            --fail-on-open

      - name: Configure Maven repositories
        shell: bash
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        run: |
          set -euo pipefail
          if [[ -z "$MAVEN_SETTINGS_XML" ]]; then
            echo "MAVEN_SETTINGS_XML is required for strict dependency verification" >&2
            exit 1
          fi
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" | base64 --decode > "$HOME/.m2/settings.xml"

      - name: Test and bootstrap cold-runner value probe classpath
        run: |
          python3 -m unittest discover -s driver/scripts -p test_bootstrap_three_line_classpath.py
          python3 driver/scripts/bootstrap-three-line-classpath.py

      - name: Verify three-line convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 driver/scripts/verify-three-line-convergence.py \
            --roots line-8 line-17 line-21 \
            --jdks "$JAVA_HOME_8_X64" "$JAVA_HOME_17_X64" "$JAVA_HOME_21_X64" \
            --expected-shas \
              "${{ steps.revisions.outputs.sha_1 }}" \
              "${{ steps.revisions.outputs.sha_2 }}" \
              "${{ steps.revisions.outputs.sha_3 }}" \
            --policy driver/config/parity/three-line-policy.json \
            --redis-native-url redis://127.0.0.1:16379 \
            --scenario-baseline target/three-line-convergence/scenario-baseline.json \
            --output target/three-line-convergence \
            --phase verify

      - name: Upload convergence evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: three-line-convergence-${{ github.run_id }}
          path: target/three-line-convergence/
          if-no-files-found: warn
          retention-days: 14
