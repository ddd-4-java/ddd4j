name: JDK 17 dependency families

on:
  push:
    branches: [feature/2.0.x]
  pull_request:
    branches: [feature/2.0.x]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-families-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          overwrite-settings: false
      - name: Verify gate regressions
        run: |
          python3 -m unittest discover -s scripts -p 'test_dependency_family_alignment.py' -v
          python3 -m unittest discover -s scripts -p 'test_dependency_version_owners.py' -v
      - name: Check source version ownership and BOM priority before Maven
        run: >-
          python3 scripts/verify_dependency_family_alignment.py --source-only
          --output "$RUNNER_TEMP/dependency-families-source"
      - name: Configure existing Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('dependencies', 'scripts/dependencies/check_dependencies.py')
          dependencies = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(dependencies)
          settings = Path.home() / '.m2/settings.xml'
          dependencies.configure_settings(os.environ.get('MAVEN_SETTINGS_XML', ''), settings)
          dependencies.ensure_central_fallback(settings)
          PY
      - name: Install pinned Easy4J build dependencies
        run: bash scripts/install-mybatis-plus-enhance.sh 2.0.x .
      - name: Build all reactor artifacts for fresh dependency resolution
        run: ./mvnw -B -ntp -DskipTests install
      - name: Verify upstream BOM ownership, Spring baseline, resolved trees and JDK bytecode
        run: >-
          python3 scripts/verify_dependency_family_alignment.py
          --output "$RUNNER_TEMP/dependency-families" --check-bytecode
      - name: Run full regression including container contracts
        run: ./mvnw -B -ntp verify
      - name: Upload models, dependencies and regression evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jdk17-dependency-families-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/dependency-families-source/
            ${{ runner.temp }}/dependency-families/
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: error
          retention-days: 14
