name: Deploy to Aliyun Maven repository

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy from (1.0.x / 2.0.x / 3.0.x)
        required: true
        type: choice
        default: '3.0.x'
        options:
          - '1.0.x'
          - '2.0.x'
          - '3.0.x'
      repository:
        description: Target Aliyun repository
        required: true
        type: choice
        default: 'snapshot'
        options:
          - 'snapshot'
          - 'release'
      dry_run:
        description: Dry run (only show what would be deployed)
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

env:
  DDD4J_REPORT_DIR: ${{ github.workspace }}/target/release-quality

jobs:
  deploy:
    name: Deploy to Aliyun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: aliyun-maven
    steps:
      - name: Validate inputs
        run: |
          BRANCH="${{ inputs.branch }}"
          if [[ ! "$BRANCH" =~ ^feature/(1\.0\.x|2\.0\.x|3\.0\.x)$ ]] && [[ ! "$BRANCH" =~ ^(1\.0\.x|2\.0\.x|3\.0\.x)$ ]]; then
            echo "ERROR: branch must be one of 1.0.x / 2.0.x / 3.0.x (or feature/<branch>)" >&2
            exit 1
          fi
          echo "Deploying branch: $BRANCH"
          echo "Target repository: ${{ inputs.repository }}"
          echo "Dry run: ${{ inputs.dry_run }}"

      - name: Determine ref
        id: ref
        run: |
          BRANCH="${{ inputs.branch }}"
          if [[ "$BRANCH" =~ ^feature/ ]]; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=feature/$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine target repository
        id: repo
        run: |
          if [[ -n "${{ inputs.repository }}" ]]; then
            REPO="${{ inputs.repository }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            REPO="release"
          else
            REPO="snapshot"
          fi
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Easy4J Maven repositories
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
          ALIYUN_USER: ${{ secrets.ALIYUN_PACKAGES_USERNAME }}
          ALIYUN_PASS: ${{ secrets.ALIYUN_PACKAGES_PASSWORD }}
        shell: bash
        run: |
          install -d -m 700 "$HOME/.m2"
          umask 077
          printf '%s' "$MAVEN_SETTINGS_XML" | base64 --decode > "$HOME/.m2/settings.xml"
          # 凭据连通性自检（直接用 secrets，避免解析 settings）
          REPO="${{ steps.repo.outputs.repo }}"
          if [[ "$REPO" == "release" ]]; then
            REPO_URL="2624322-release-6f6h6r"
          else
            REPO_URL="2624322-snapshot-3eoov3"
          fi
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -u "$ALIYUN_USER:$ALIYUN_PASS" \
            "https://packages.aliyun.com/6927b116e6c3e0425dbdf60d/maven/${REPO_URL}/io/github/easy4j/spring-extension/3.0.x.20260630-SNAPSHOT/maven-metadata.xml" || echo curl-failed)
          echo "Aliyun ${REPO} credential check: HTTP $HTTP_CODE (user len ${#ALIYUN_USER})"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "::error::Aliyun ${REPO} auth failed (HTTP $HTTP_CODE)" >&2
            exit 1
          fi

      - name: Install reactor artifacts
        run: ./mvnw -U -Denforcer.skip=true -B -DskipTests install -pl '!ddd4j-samples/ddd4j-sample-dropwizard,!ddd4j-samples/ddd4j-sample-helidon,!ddd4j-samples/ddd4j-sample-javalin,!ddd4j-samples/ddd4j-sample-javalin-cqrs,!ddd4j-samples/ddd4j-sample-javalin-satoken,!ddd4j-samples/ddd4j-sample-javalin-shiro,!ddd4j-samples/ddd4j-sample-micronaut,!ddd4j-samples/ddd4j-sample-order-application,!ddd4j-samples/ddd4j-sample-order-domain,!ddd4j-samples/ddd4j-sample-order-jdbc,!ddd4j-samples/ddd4j-sample-order-kafka,!ddd4j-samples/ddd4j-sample-order-local,!ddd4j-samples/ddd4j-sample-order-redis,!ddd4j-samples/ddd4j-sample-order-testkit,!ddd4j-samples/ddd4j-sample-quarkus,!ddd4j-samples/ddd4j-sample-quarkus-cqrs,!ddd4j-samples/ddd4j-sample-quarkus-satoken,!ddd4j-samples/ddd4j-sample-quarkus-shiro,!ddd4j-samples/ddd4j-sample-vertx'

      - name: Deploy to Aliyun
        env:
          MAVEN_SETTINGS_XML: ${{ secrets.MAVEN_SETTINGS_XML }}
        shell: bash
        run: |
          DRY_RUN_ARG=""
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            DRY_RUN_ARG="-DdryRun=true"
            echo "::notice::Dry run mode — no artifacts will be deployed"
          fi
          REPO="${{ steps.repo.outputs.repo }}"
          # 验证版本号与目标仓库匹配：
          #   snapshot 阶段：版本必须包含 -SNAPSHOT
          #   release 阶段：版本必须不包含 -SNAPSHOT
          VERSION=$(./mvnw -q -B -N help:evaluate -Dexpression=project.version -DforceStdout 2>/dev/null | tail -1)
          echo "Project version: $VERSION"
          if [[ "$REPO" == "snapshot" && "$VERSION" != *-SNAPSHOT ]]; then
            echo "::error::Repository is 'snapshot' but version $VERSION is not a -SNAPSHOT" >&2
            exit 1
          fi
          if [[ "$REPO" == "release" && "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Repository is 'release' but version $VERSION is still -SNAPSHOT" >&2
            echo "::error::To deploy a release, first run a release version bump commit" >&2
            exit 1
          fi
          # 部署到 Aliyun（sample 模块被排除）
          ./mvnw -U -Denforcer.skip=true -B $DRY_RUN_ARG -DskipTests \
            -pl '!ddd4j-samples/ddd4j-sample-dropwizard,!ddd4j-samples/ddd4j-sample-helidon,!ddd4j-samples/ddd4j-sample-javalin,!ddd4j-samples/ddd4j-sample-javalin-cqrs,!ddd4j-samples/ddd4j-sample-javalin-satoken,!ddd4j-samples/ddd4j-sample-javalin-shiro,!ddd4j-samples/ddd4j-sample-micronaut,!ddd4j-samples/ddd4j-sample-order-application,!ddd4j-samples/ddd4j-sample-order-domain,!ddd4j-samples/ddd4j-sample-order-jdbc,!ddd4j-samples/ddd4j-sample-order-kafka,!ddd4j-samples/ddd4j-sample-order-local,!ddd4j-samples/ddd4j-sample-order-redis,!ddd4j-samples/ddd4j-sample-order-testkit,!ddd4j-samples/ddd4j-sample-quarkus,!ddd4j-samples/ddd4j-sample-quarkus-cqrs,!ddd4j-samples/ddd4j-sample-quarkus-satoken,!ddd4j-samples/ddd4j-sample-quarkus-shiro,!ddd4j-samples/ddd4j-sample-vertx' \
            deploy

      - name: Generate deploy report
        if: always()
        run: |
          REPORT_DIR="${DDD4J_REPORT_DIR}"
          mkdir -p "${REPORT_DIR}"
          {
            echo "# Deploy Report"
            echo ""
            echo "- Branch: ${{ inputs.branch }}"
            echo "- Target repository: ${{ steps.repo.outputs.repo }}"
            echo "- Dry run: ${{ inputs.dry_run }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Run: ${{ github.run_id }}"
            echo "- Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${REPORT_DIR}/deploy-report.md"
          echo "[INFO] Deploy report written to ${REPORT_DIR}/deploy-report.md"

      - name: Archive deploy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ddd4j-deploy-report
          path: ${{ env.DDD4J_REPORT_DIR }}/deploy-report.md
          if-no-files-found: warn
          retention-days: 30
