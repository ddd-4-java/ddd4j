name: Deploy ddd4j

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual deploy)'
        required: false
        default: 'false'
        type: boolean
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Aliyun Maven
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: 'maven'
          overwrite-settings: true

      - name: Configure Easy4J Maven repositories
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>2624322-release-6F6h6R</id>
                <username>${env.ALIYUN_MAVEN_USERNAME}</username>
                <password>${env.ALIYUN_MAVEN_PASSWORD}</password>
              </server>
              <server>
                <id>2624322-snapshot-3EoOv3</id>
                <username>${env.ALIYUN_MAVEN_USERNAME}</username>
                <password>${env.ALIYUN_MAVEN_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          SETTINGS
        env:
          ALIYUN_MAVEN_USERNAME: ${{ secrets.ALIYUN_MAVEN_USERNAME }}
          ALIYUN_MAVEN_PASSWORD: ${{ secrets.ALIYUN_MAVEN_PASSWORD }}

      - name: Install reactor artifacts
        run: ./mvnw -U -Denforcer.skip=true -B -DskipTests install

      - name: Deploy SNAPSHOT
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.ref, 'SNAPSHOT'))
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run - skipping deploy"
          else
            ./mvnw -U -B -Denforcer.skip=true -DskipTests deploy -pl '!ddd4j-bom'
          fi

      - name: Deploy Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, 'SNAPSHOT')
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "Dry run - skipping deploy"
          else
            ./mvnw -U -B -Denforcer.skip=true -DskipTests deploy -pl '!ddd4j-bom'
          fi
