# QuarkusProjectionPositionRepositoryIT（@QuarkusTest）H2 内存库配置（Task 7.3，Docker 无关）：
# - db-kind=h2 + quarkus-jdbc-h2 测试依赖 → H2 嵌入式驱动；MODE=PostgreSQL 与
#   -jpa 模块 IT（application-test.yml）同款方言对齐
# - devservices 显式关闭，并给出 H2 内存 URL，使测试无需 Docker；
#   （DB_CLOSE_DELAY=-1 保持库存活跨连接；命名内存库隔离于其它 H2 实例）
# - drop-and-create：每次测试 JVM 启动重建 ddd4j_projection_position 表（含 stream_id 主键）
# - SQL 日志关闭：保持测试输出干净
quarkus.datasource.db-kind=h2
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:h2:mem:projit;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
