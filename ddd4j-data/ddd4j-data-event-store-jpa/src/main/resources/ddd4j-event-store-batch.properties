#
# Hibernate 批量插入优化配置（参考样本）。
#
# 配合 io.ddd4j.data.event.store.jpa.JpaEventStore#append 使用：
# 在 Spring Boot 应用的 application.yml / application.properties 中加入以下配置
# 启用 Hibernate 批量 INSERT。
#
# 未配置 batch_size 时，每次 flush() 仍会发出单条 INSERT——行为正确但无性能提升。
# 配置后 N 条 INSERT 合并为 N/batch_size 个批量 SQL。
#

# Hibernate JDBC 批量大小（推荐 30-50）
spring.jpa.properties.hibernate.jdbc.batch_size=50

# INSERT 语句按实体顺序排序后再批量（提高 batching 命中率）
spring.jpa.properties.hibernate.order_inserts=true

# UPDATE 同理
spring.jpa.properties.hibernate.order_updates=true

# 可选：批量版本控制（DDL 生成策略为 validate 时需开启）
# spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
