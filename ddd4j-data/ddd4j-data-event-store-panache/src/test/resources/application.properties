# PanacheEventStoreIT（@QuarkusTest）H2 内存库配置（Task 5.1/5.2，Docker 无关）：
# - db-kind=h2 + quarkus-jdbc-h2 测试依赖 → H2 嵌入式驱动
# - devservices 显式关闭：禁止 Quarkus 尝试启动容器化数据源（本轨必须 Docker 缺席可跑）；
#   JDK 8 线显式提供 H2 URL，避免依赖容器化数据源
#   （DB_CLOSE_DELAY=-1 保持库存活跨连接；命名内存库隔离于其它 H2 实例）
# - drop-and-create：每次测试 JVM 启动重建 ddd4j_stored_event 表（含 uk_aggregate_version）
# - SQL 日志关闭：保持测试输出干净
quarkus.datasource.db-kind=h2
quarkus.datasource.devservices.enabled=false
quarkus.datasource.jdbc.url=jdbc:h2:mem:ddd4j_event_store_it;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
